openapi: 3.0.3
info:
  title: Trading Lab API
  version: 1.0.0
  description: REST API contract for the Trading Lab frontend.
servers:
  - url: /api/v1
paths:
  /health:
    get:
      summary: Health check
      operationId: healthCheck
      responses:
        '200':
          description: Backend health
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /options:
    get:
      summary: Get supported enum values and frontend options
      operationId: getOptions
      responses:
        '200':
          description: Supported options
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OptionsResponse'
  /experiments:
    post:
      summary: Create experiment
      operationId: createExperiment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExperimentRequest'
      responses:
        '201':
          description: Experiment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateExperimentResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      summary: List experiments
      operationId: listExperiments
      parameters:
        - in: query
          name: status
          schema:
            $ref: '#/components/schemas/ExperimentStatus'
        - in: query
          name: strategyType
          schema:
            $ref: '#/components/schemas/StrategyType'
        - in: query
          name: mode
          schema:
            $ref: '#/components/schemas/ExperimentMode'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Experiment summaries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedExperimentSummaryResponse'
  /experiments/{experimentId}:
    get:
      summary: Get experiment detail
      operationId: getExperimentDetail
      parameters:
        - $ref: '#/components/parameters/ExperimentId'
      responses:
        '200':
          description: Experiment detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentDetailResponse'
        '404':
          description: Experiment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /experiments/{experimentId}/start:
    post:
      summary: Start experiment asynchronously
      operationId: startExperiment
      parameters:
        - $ref: '#/components/parameters/ExperimentId'
      responses:
        '202':
          description: Start accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentActionResponse'
        '409':
          description: Invalid status transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /experiments/{experimentId}/pause:
    post:
      summary: Pause experiment
      operationId: pauseExperiment
      parameters:
        - $ref: '#/components/parameters/ExperimentId'
      responses:
        '200':
          description: Paused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentActionResponse'
  /experiments/{experimentId}/resume:
    post:
      summary: Resume experiment asynchronously
      operationId: resumeExperiment
      parameters:
        - $ref: '#/components/parameters/ExperimentId'
      responses:
        '202':
          description: Resume accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentActionResponse'
  /experiments/{experimentId}/stop:
    post:
      summary: Stop experiment
      operationId: stopExperiment
      parameters:
        - $ref: '#/components/parameters/ExperimentId'
      responses:
        '200':
          description: Stopped
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentActionResponse'
  /experiments/{experimentId}/run-next-step:
    post:
      summary: Trigger one manual execution step
      operationId: runNextStep
      parameters:
        - $ref: '#/components/parameters/ExperimentId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunNextStepRequest'
      responses:
        '202':
          description: Manual execution step accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunNextStepResponse'
        '404':
          description: Experiment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Invalid experiment state, configuration, or concurrent step
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /experiments/{experimentId}/metrics:
    get:
      summary: List metric snapshots
      operationId: listMetrics
      parameters:
        - $ref: '#/components/parameters/ExperimentId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Metric snapshots
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMetricSnapshotResponse'
        '404':
          description: Experiment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /experiments/{experimentId}/portfolio-snapshots:
    get:
      summary: List portfolio snapshots
      operationId: listPortfolioSnapshots
      parameters:
        - $ref: '#/components/parameters/ExperimentId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Portfolio snapshots
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPortfolioSnapshotResponse'
        '404':
          description: Experiment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /experiments/compare:
    post:
      summary: Compare experiments using persisted metrics
      operationId: compareExperiments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompareExperimentsRequest'
      responses:
        '200':
          description: Comparison results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompareExperimentsResponse'
        '404':
          description: Experiment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /events:
    get:
      summary: List system events
      operationId: listEvents
      parameters:
        - in: query
          name: experimentId
          schema:
            type: integer
            format: int64
        - in: query
          name: level
          schema:
            $ref: '#/components/schemas/EventLevel'
        - in: query
          name: eventType
          schema:
            $ref: '#/components/schemas/SystemEventType'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: System events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSystemEventResponse'
        '404':
          description: Experiment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /experiments/{experimentId}/events:
    get:
      summary: List experiment system events
      operationId: listExperimentEvents
      parameters:
        - $ref: '#/components/parameters/ExperimentId'
        - in: query
          name: level
          schema:
            $ref: '#/components/schemas/EventLevel'
        - in: query
          name: eventType
          schema:
            $ref: '#/components/schemas/SystemEventType'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Experiment system events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSystemEventResponse'
        '404':
          description: Experiment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  parameters:
    ExperimentId:
      name: experimentId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 50
        minimum: 1
        maximum: 1000
    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        default: 0
        minimum: 0
  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
        service:
          type: string
        version:
          type: string
    ExperimentMode:
      type: string
      enum: [HISTORICAL_SIMULATION, LIVE_SIMULATION, PAPER_TRADING]
    StrategyType:
      type: string
      enum: [BUY_AND_HOLD, MOVING_AVERAGE, AGENTIC_AI]
    ExperimentStatus:
      type: string
      enum: [CREATED, RUNNING, PAUSED, STOPPED, COMPLETED, FAILED]
    TradingFrequency:
      type: string
      enum: [DAILY, WEEKLY, MONTHLY]
    FeeModelType:
      type: string
      enum: [NONE, FIXED, PERCENTAGE]
    ExecutionStepStatus:
      type: string
      enum: [RUNNING, COMPLETED, SKIPPED, FAILED]
    TriggerType:
      type: string
      enum: [HISTORICAL, SCHEDULED, MANUAL]
    DecisionSourceType:
      type: string
      enum: [STRATEGY, AGENT]
    TradeAction:
      type: string
      enum: [BUY, SELL, HOLD]
    FinalAction:
      type: string
      enum: [BUY, SELL, HOLD]
    OrderMode:
      type: string
      enum: [SIMULATED, PAPER_BROKER]
    BrokerName:
      type: string
      enum: [ALPACA, NONE]
    OrderSide:
      type: string
      enum: [BUY, SELL]
    OrderType:
      type: string
      enum: [MARKET]
    OrderStatus:
      type: string
      enum: [CREATED, SUBMITTED, FILLED, REJECTED, FAILED, CANCELLED]
    AgentMode:
      type: string
      enum: [SINGLE_AGENT, PIPELINE]
    AgentStepName:
      type: string
      enum: [SINGLE_DECISION_AGENT, MARKET_ANALYST, TRADING_DECISION, RISK_MANAGER]
    ParsingStatus:
      type: string
      enum: [SUCCESS, FAILED, REPAIRED]
    BrokerSyncStatus:
      type: string
      enum: [SUCCESS, FAILED, MISMATCH]
    EventLevel:
      type: string
      enum: [INFO, WARNING, ERROR]
    SystemEventType:
      type: string
      enum:
        - EXPERIMENT_CREATED
        - EXPERIMENT_STARTED
        - EXPERIMENT_PAUSED
        - EXPERIMENT_RESUMED
        - EXPERIMENT_STOPPED
        - EXPERIMENT_COMPLETED
        - EXPERIMENT_FAILED
        - MARKET_DATA_MISSING
        - STRATEGY_DECISION_CREATED
        - RISK_LIMIT_TRIGGERED
        - ORDER_SUBMITTED
        - ORDER_FILLED
        - ORDER_FAILED
        - BROKER_SYNC_FAILED
        - BROKER_STATE_MISMATCH
        - LLM_OUTPUT_INVALID
        - LLM_REPAIR_ATTEMPTED
        - FALLBACK_HOLD_USED
    CreateExperimentRequest:
      type: object
      required: [name, mode, strategyType, assetSymbol, initialCapital, startDate, endDate, tradingFrequency, feeModelType, feeValue, strategyConfig]
      properties:
        name:
          type: string
        mode:
          $ref: '#/components/schemas/ExperimentMode'
        strategyType:
          $ref: '#/components/schemas/StrategyType'
        assetSymbol:
          type: string
          example: SPY
        initialCapital:
          type: number
          format: double
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        tradingFrequency:
          $ref: '#/components/schemas/TradingFrequency'
        feeModelType:
          $ref: '#/components/schemas/FeeModelType'
        feeValue:
          type: number
          format: double
        strategyConfig:
          $ref: '#/components/schemas/StrategyConfigInput'
    StrategyConfigInput:
      type: object
      required: [strategyVersion]
      properties:
        strategyVersion:
          type: string
        movingAverageWindow:
          type: integer
          nullable: true
        positionSizingType:
          type: string
          nullable: true
        agentMode:
          allOf:
            - $ref: '#/components/schemas/AgentMode'
          nullable: true
        modelName:
          type: string
          nullable: true
        confidenceThreshold:
          type: number
          format: double
          nullable: true
        parametersJson:
          type: object
          additionalProperties: true
          nullable: true
          example:
            riskConfig:
              maxPositionSizePct: 1.0
              maxTradesPerDay: null
              maxTradesPerWeek: null
              maxDrawdownPct: null
              drawdownAction: BLOCK_TRADES
              fallbackAction: HOLD
    Experiment:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        mode:
          $ref: '#/components/schemas/ExperimentMode'
        strategyType:
          $ref: '#/components/schemas/StrategyType'
        assetSymbol:
          type: string
        status:
          $ref: '#/components/schemas/ExperimentStatus'
        initialCapital:
          type: number
          format: double
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        tradingFrequency:
          $ref: '#/components/schemas/TradingFrequency'
        feeModelType:
          $ref: '#/components/schemas/FeeModelType'
        feeValue:
          type: number
          format: double
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    StrategyConfig:
      allOf:
        - $ref: '#/components/schemas/StrategyConfigInput'
        - type: object
          properties:
            id:
              type: integer
              format: int64
            experimentId:
              type: integer
              format: int64
            strategyType:
              $ref: '#/components/schemas/StrategyType'
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
    Portfolio:
      type: object
      properties:
        id:
          type: integer
          format: int64
        experimentId:
          type: integer
          format: int64
        cash:
          type: number
          format: double
        positionSymbol:
          type: string
          nullable: true
        positionQuantity:
          type: number
          format: double
          nullable: true
        currentPrice:
          type: number
          format: double
          nullable: true
        currentPositionValue:
          type: number
          format: double
          nullable: true
        currentPortfolioValue:
          type: number
          format: double
          nullable: true
        updatedAt:
          type: string
          format: date-time
    CreateExperimentResponse:
      type: object
      properties:
        experiment:
          $ref: '#/components/schemas/Experiment'
        portfolio:
          $ref: '#/components/schemas/Portfolio'
    ExperimentSummary:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        mode:
          $ref: '#/components/schemas/ExperimentMode'
        strategyType:
          $ref: '#/components/schemas/StrategyType'
        assetSymbol:
          type: string
        status:
          $ref: '#/components/schemas/ExperimentStatus'
        currentPortfolioValue:
          type: number
          format: double
          nullable: true
        totalReturn:
          type: number
          format: double
          nullable: true
        profitLoss:
          type: number
          format: double
          nullable: true
        numberOfTrades:
          type: integer
          nullable: true
        maxDrawdown:
          type: number
          format: double
          nullable: true
        lastTrade:
          allOf:
            - $ref: '#/components/schemas/TradeSummary'
          nullable: true
        latestAgentDecisions:
          type: array
          items:
            $ref: '#/components/schemas/AgentDecisionSummary'
    PaginatedExperimentSummaryResponse:
      allOf:
        - $ref: '#/components/schemas/PaginatedResponseBase'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ExperimentSummary'
    ExperimentDetailResponse:
      type: object
      properties:
        experiment:
          $ref: '#/components/schemas/Experiment'
        strategyConfig:
          $ref: '#/components/schemas/StrategyConfig'
        portfolio:
          $ref: '#/components/schemas/Portfolio'
        latestMetrics:
          $ref: '#/components/schemas/MetricSnapshot'
        latestAgentDecisions:
          type: array
          items:
            $ref: '#/components/schemas/AgentDecisionSummary'
    ExperimentActionResponse:
      type: object
      properties:
        experimentId:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/ExperimentStatus'
        message:
          type: string
          nullable: true
    RunNextStepRequest:
      type: object
      properties:
        triggerReason:
          type: string
          nullable: true
    RunNextStepResponse:
      type: object
      properties:
        experimentId:
          type: integer
          format: int64
        executionStepId:
          type: integer
          format: int64
        status:
          type: string
          description: Execution step status when a step is created, or experiment status when no step is created.
        message:
          type: string
    ExecutionStep:
      type: object
      properties:
        id:
          type: integer
          format: int64
        experimentId:
          type: integer
          format: int64
        scheduledFor:
          type: string
          format: date-time
          nullable: true
        startedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        status:
          $ref: '#/components/schemas/ExecutionStepStatus'
        triggerType:
          $ref: '#/components/schemas/TriggerType'
        sequenceNumber:
          type: integer
        errorMessage:
          type: string
          nullable: true
    PaginatedExecutionStepResponse:
      allOf:
        - $ref: '#/components/schemas/PaginatedResponseBase'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ExecutionStep'
    MarketDataSnapshot:
      type: object
      properties:
        symbol:
          type: string
        price:
          type: number
          format: double
          nullable: true
        open:
          type: number
          format: double
          nullable: true
        high:
          type: number
          format: double
          nullable: true
        low:
          type: number
          format: double
          nullable: true
        close:
          type: number
          format: double
          nullable: true
        volume:
          type: number
          format: double
          nullable: true
        movingAverage:
          type: number
          format: double
          nullable: true
        rsi:
          type: number
          format: double
          nullable: true
    TradingDecision:
      type: object
      properties:
        id:
          type: integer
          format: int64
        action:
          $ref: '#/components/schemas/TradeAction'
        sourceType:
          $ref: '#/components/schemas/DecisionSourceType'
        sourceName:
          type: string
          nullable: true
        symbol:
          type: string
        suggestedQuantity:
          type: number
          format: double
          nullable: true
        suggestedNotional:
          type: number
          format: double
          nullable: true
        confidence:
          type: number
          format: double
          nullable: true
        reason:
          type: string
          nullable: true
    RiskCheck:
      type: object
      properties:
        approved:
          type: boolean
        finalAction:
          $ref: '#/components/schemas/FinalAction'
        finalQuantity:
          type: number
          format: double
          nullable: true
        finalNotional:
          type: number
          format: double
          nullable: true
        rejectionReason:
          type: string
          nullable: true
        rulesTriggeredJson:
          type: object
          additionalProperties: true
          nullable: true
    Order:
      type: object
      properties:
        id:
          type: integer
          format: int64
        executionStepId:
          type: integer
          format: int64
        experimentId:
          type: integer
          format: int64
        mode:
          $ref: '#/components/schemas/OrderMode'
        brokerName:
          $ref: '#/components/schemas/BrokerName'
        brokerOrderId:
          type: string
          nullable: true
        symbol:
          type: string
        side:
          $ref: '#/components/schemas/OrderSide'
        quantity:
          type: number
          format: double
        orderType:
          $ref: '#/components/schemas/OrderType'
        status:
          $ref: '#/components/schemas/OrderStatus'
        submittedAt:
          type: string
          format: date-time
          nullable: true
        filledAt:
          type: string
          format: date-time
          nullable: true
        averageFillPrice:
          type: number
          format: double
          nullable: true
        errorMessage:
          type: string
          nullable: true
    Trade:
      type: object
      properties:
        id:
          type: integer
          format: int64
        executionStepId:
          type: integer
          format: int64
        experimentId:
          type: integer
          format: int64
        orderId:
          type: integer
          format: int64
        timestamp:
          type: string
          format: date-time
        symbol:
          type: string
        side:
          $ref: '#/components/schemas/OrderSide'
        quantity:
          type: number
          format: double
        price:
          type: number
          format: double
        orderValue:
          type: number
          format: double
          nullable: true
        fee:
          type: number
          format: double
          nullable: true
        portfolioValueAfterTrade:
          type: number
          format: double
          nullable: true
    TradeSummary:
      type: object
      properties:
        side:
          $ref: '#/components/schemas/OrderSide'
        quantity:
          type: number
          format: double
        price:
          type: number
          format: double
        timestamp:
          type: string
          format: date-time
    PortfolioSnapshot:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        cash:
          type: number
          format: double
        positionSymbol:
          type: string
          nullable: true
        positionQuantity:
          type: number
          format: double
          nullable: true
        positionMarketValue:
          type: number
          format: double
          nullable: true
        totalPortfolioValue:
          type: number
          format: double
          nullable: true
        currentPrice:
          type: number
          format: double
          nullable: true
    MetricSnapshot:
      type: object
      nullable: true
      properties:
        timestamp:
          type: string
          format: date-time
          nullable: true
        totalReturn:
          type: number
          format: double
          nullable: true
        profitLoss:
          type: number
          format: double
          nullable: true
        numberOfTrades:
          type: integer
          nullable: true
        maxDrawdown:
          type: number
          format: double
          nullable: true
        buyAndHoldReturn:
          type: number
          format: double
          nullable: true
        differenceToBuyAndHold:
          type: number
          format: double
          nullable: true
    AgentDecisionSummary:
      type: object
      properties:
        executionStepId:
          type: integer
          format: int64
        agentMode:
          $ref: '#/components/schemas/AgentMode'
        action:
          $ref: '#/components/schemas/TradeAction'
        confidence:
          type: number
          format: double
          nullable: true
        reason:
          type: string
          nullable: true
        finalAction:
          $ref: '#/components/schemas/FinalAction'
        createdAt:
          type: string
          format: date-time
    AgentDecisionLog:
      type: object
      properties:
        id:
          type: integer
          format: int64
        executionStepId:
          type: integer
          format: int64
        experimentId:
          type: integer
          format: int64
        tradingDecisionId:
          type: integer
          format: int64
          nullable: true
        agentMode:
          $ref: '#/components/schemas/AgentMode'
        agentStepName:
          $ref: '#/components/schemas/AgentStepName'
        agentName:
          type: string
          nullable: true
        promptVersion:
          type: string
          nullable: true
        modelName:
          type: string
          nullable: true
        modelVersion:
          type: string
          nullable: true
        inputJson:
          type: object
          additionalProperties: true
          nullable: true
        promptText:
          type: string
          nullable: true
        rawOutputText:
          type: string
          nullable: true
        parsedOutputJson:
          type: object
          additionalProperties: true
          nullable: true
        parsingStatus:
          $ref: '#/components/schemas/ParsingStatus'
        repairPromptText:
          type: string
          nullable: true
        repairRawOutputText:
          type: string
          nullable: true
        createdAt:
